<script>
    let totemSeleccionado = null;

    function seleccionarTotem(totemId) {
        // Quitar selección anterior
        document.querySelectorAll('.totem-card').forEach(card => {
            card.classList.remove('selected');
        });

        // Seleccionar nuevo totem
        const card = document.querySelector(`[data-totem-id="${totemId}"]`);
        card.classList.add('selected');
        
        totemSeleccionado = totemId;
        
        // Habilitar botón confirmar
        const btnConfirmar = document.getElementById('confirmar-btn');
        btnConfirmar.classList.add('enabled');
    }

    document.getElementById('confirmar-btn').addEventListener('click', function() {
        if (!totemSeleccionado) {
            mostrarAlerta('Selecciona un totem primero', 'error');
            return;
        }
        this.textContent = 'Configurando...';
        this.disabled = true;

        // Desde /lector/configuracion/ esto resuelve a /lector/configuracion/guardar_totem/
        fetch('guardar_totem/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                totem_id: totemSeleccionado
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // En la vista mandas id y ubicacion, así que uso ubicacion
                const nombreTotem = data.totem?.ubicacion || 'Totem configurado';
                mostrarAlerta(`Dispositivo configurado como: ${nombreTotem}`, 'success');

                // Redirigir al lector QR
                const redirectUrl = data.redirect_url || '/lector/';
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            } else {
                mostrarAlerta(data.error || 'Error al guardar configuración', 'error');
                this.textContent = 'Confirmar Configuración';
                this.disabled = false;
            }
        })
        .catch(error => {
            mostrarAlerta('Error de conexión', 'error');
            this.textContent = 'Confirmar Configuración';
            this.disabled = false;
        });
    });

    function mostrarAlerta(mensaje, tipo) {
        const alert = document.getElementById('alert');
        alert.className = `alert alert-${tipo}`;
        alert.textContent = mensaje;
        alert.style.display = 'block';
        
        if (tipo === 'success') {
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }
    }
</script>
